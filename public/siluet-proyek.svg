<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260"
     width="1600" height="260" fill="none" aria-hidden="true">
  <!--
    Siluet keenam project, dari kiri ke kanan mengikuti urutannya di layar
    pemilih: Banara Serpong, Marchand Hype Station, Mazenta Residence,
    Naraya Serpong, BIO District, Permai Indah.

    Bukan gambar lambang. Lambang yang digambar ulang berdasarkan perkiraan
    akan mirip, tidak sama — dan yang beredar seharusnya yang asli. Yang
    digambar di sini watak bangunannya: rumah tapak beratap pelana, deret niaga
    beratap datar dengan papan nama, menara ramping bertumpuk, deret berkolom,
    blok-blok membulat, dan rumah dengan tunas di sampingnya.

    Satu warna, tanpa latar. Kepekatannya diatur dari lembar gaya, bukan dari
    berkas ini: yang sama dipakai di atas bidang terang maupun hangat.
  -->
  <g fill="#15171A">
    <!-- Banara Serpong — tiga rumah tapak beratap pelana. -->
    <path d="M34 170 85 128 136 170Z" />
    <rect x="40" y="170" width="90" height="70" />
    <path d="M139 150 180 112 221 150Z" />
    <rect x="145" y="150" width="70" height="90" />
    <path d="M219 182 255 152 291 182Z" />
    <rect x="225" y="182" width="60" height="58" />

    <!-- Marchand Hype Station — deret niaga beratap datar, berkanopi, dengan
         papan nama menjulang. -->
    <rect x="300" y="176" width="200" height="64" />
    <rect x="290" y="166" width="220" height="10" />
    <rect x="470" y="104" width="8" height="62" />
    <rect x="450" y="82" width="48" height="26" rx="4" />

    <!-- Mazenta Residence — menara ramping bertumpuk, meniru susunan batunya. -->
    <rect x="585" y="96" width="62" height="144" />
    <rect x="598" y="72" width="36" height="24" />
    <circle cx="616" cy="54" r="14" />

    <!-- Naraya Serpong — deret rendah berkolom, sejalan dengan huruf berkait
         pada namanya. -->
    <path d="M730 150 855 110 980 150Z" />
    <rect x="730" y="150" width="250" height="18" />
    <rect x="746" y="168" width="16" height="72" />
    <rect x="790" y="168" width="16" height="72" />
    <rect x="834" y="168" width="16" height="72" />
    <rect x="878" y="168" width="16" height="72" />
    <rect x="922" y="168" width="16" height="72" />
    <rect x="952" y="168" width="16" height="72" />
    <rect x="722" y="232" width="266" height="8" />

    <!-- BIO District — blok-blok bersudut bulat, mengikuti bentuk lambangnya. -->
    <rect x="1010" y="128" width="70" height="112" rx="10" />
    <rect x="1092" y="96" width="58" height="144" rx="10" />
    <rect x="1162" y="150" width="96" height="90" rx="18" />

    <!-- Permai Indah — rumah tapak dengan tunas berdaun dua di sampingnya. -->
    <path d="M1294 172 1350 132 1406 172Z" />
    <rect x="1300" y="172" width="100" height="68" />
    <path d="M1406 190 1445 162 1484 190Z" />
    <rect x="1412" y="190" width="66" height="50" />
    <rect x="1521" y="168" width="8" height="72" />
    <path d="M1525 172C1490 160 1482 122 1508 106 1534 118 1540 154 1525 172Z" />
    <path d="M1525 172C1560 160 1568 122 1542 106 1516 118 1510 154 1525 172Z" />

    <!-- Garis tanah yang menyambungkan keenamnya menjadi satu tampak. -->
    <rect x="0" y="240" width="1600" height="3" />
  </g>
</svg>
