services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: klaim
      POSTGRES_USER: klaim
      POSTGRES_PASSWORD: klaim
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaim -d klaim"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://klaim:klaim@db:5432/klaim
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
